type = "optional"
versionRange = "[3.0.4,)"

[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[0.5.1,)"

[[dependencies.${mod_id}]]
modId = "immersiveengineering"
type = "optional"
versionRange = "[1.21.1-12.2.0-187,)"

