javadoc {
    source = [sourceSets.main.allJava]
    // prevent java 8's strict doclint for javadocs from failing builds
    options.addStringOption('Xdoclint:none', '-quiet')
}

artifacts {
    archives jar, sourcesJar, javadocJar
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata
createMinecraftArtifacts.dependsOn(generateModMetadata)

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            artifactId = "${mod_name}".toLowerCase()
            groupId = "com.tagnumelite.projecteintegration"

            artifacts {
                sourcesJar
                javadocJar
            }

            pom {
                scm {
                    url = "https://github.com/TagnumElite/ProjectE-Integration.git"
                }
                issueManagement {
                    system = 'github'
                    url = "https://github.com/TagnumElite/ProjectE-Integration/issues"
                }
                licenses {
                    license {
                        name = 'MIT'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
        // GitHub Packages
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/tagnumelite/projecte-integration"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
        // maven.tagnumelite.com
        maven {
            name = "TagnumEliteMaven"
            url = "https://maven.tagnumelite.com/releases"
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

changelog {
    version = "${project.version}"
    path = "${project.projectDir}/CHANGELOG.md"
    header = "[${-> version.get()}]"
    itemPrefix = "-"
    keepUnreleasedSection = true
    unreleasedTerm = "[Unreleased]"
    groups = ["Added", "Changed", "Ported", "Deprecated", "Removed", "Fixed", "Security"]
}

if (System.getenv().CURSEFORGE_API_KEY != null) {
    tasks.register('curseforge', TaskPublishCurseForge) {
        apiToken = System.getenv().CURSEFORGE_API_KEY
        def mainFile = upload(cf_project, jar)
        mainFile.changelog = changelog.renderItem(changelog.get(mod_version), Changelog.OutputType.MARKDOWN)
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = "${release_type}"
        mainFile.addModLoader("NeoForge")
        mainFile.withAdditionalFile(sourcesJar)
        mainFile.withAdditionalFile(javadocJar)

        // Relations
        mainFile.addRequirement('projecte')
        mainFile.addOptional(
